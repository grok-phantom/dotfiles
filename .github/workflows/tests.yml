name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.13'
      - name: Provide Linux shell parser
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Provide hash-locked chezmoi in runner temp
        run: python -B tests/ci_fetch_chezmoi.py
      - name: Offline unit and static suites
        env:
          PYTHON: python
        run: ./scripts/test all --report-dir .test-results/ci
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotfiles-${{ matrix.os }}-${{ github.sha }}
          path: .test-results/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
