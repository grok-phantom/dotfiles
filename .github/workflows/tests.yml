name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.13'
      - name: Provide Linux shell parser
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Provide hash-locked chezmoi in runner temp
        run: python -B tests/ci_fetch_chezmoi.py
      - name: Offline unit and static suites
        env:
          PYTHON: python
        run: ./scripts/test all --report-dir .test-results/ci
      - name: Upload synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotfiles-${{ matrix.os }}-${{ github.sha }}
          path: .test-results/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
