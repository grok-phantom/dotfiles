{{- /* chezmoi:modify-template */ -}}
{{- /* Herdr also writes this file. Own only shared preferences; preserve local keys. */ -}}
{{- $config := .chezmoi.stdin | fromToml -}}
{{- $before := toJson $config -}}
{{- $_ := set $config "onboarding" false -}}
{{- $theme := get $config "theme" | default (dict) -}}
{{- $_ := set $theme "name" "gruvbox" -}}
{{- $_ := set $theme "auto_switch" false -}}
{{- $_ := set $config "theme" $theme -}}
{{- $ui := get $config "ui" | default (dict) -}}
{{- $_ := set $ui "prompt_new_tab_name" false -}}
{{- $_ := set $ui "sidebar_width" 36 -}}
{{- $sidebar := get $ui "sidebar" | default (dict) -}}
{{- $agents := get $sidebar "agents" | default (dict) -}}
{{- $_ := set $agents "rows" (list (list "state_icon" "pane") (list "workspace" "machine")) -}}
{{- $_ := set $sidebar "agents" $agents -}}
{{- $_ := set $ui "sidebar" $sidebar -}}
{{- $toast := get $ui "toast" | default (dict) -}}
{{- $_ := set $toast "delivery" "terminal" -}}
{{- $_ := set $ui "toast" $toast -}}
{{- $_ := set $config "ui" $ui -}}
{{- $keys := get $config "keys" | default (dict) -}}
{{- $_ := set $keys "cycle_pane_next" "" -}}
{{- $_ := set $keys "last_pane" "prefix+tab" -}}
{{- $wanted := .herdr_shortcuts.bindings -}}
{{- $owned := .herdr_shortcuts.retired_commands -}}
{{- range $wanted -}}{{- $owned = append $owned .command -}}{{- end -}}
{{- $commands := list -}}
{{- range get $keys "command" | default (list) -}}
{{-   if not (has .command $owned) -}}
{{-     $existing := . -}}
{{-     range $wanted -}}
{{-       if eq .key $existing.key -}}
{{-         fail (printf "Herdr shortcut %s is already used by %s" .key $existing.command) -}}
{{-       end -}}
{{-     end -}}
{{-     $commands = append $commands . -}}
{{-   end -}}
{{- end -}}
{{- range $wanted -}}
{{-   $binding := . -}}
{{-   range $name, $value := $keys -}}
{{-     if and (kindIs "string" $value) (eq $value $binding.key) -}}
{{-       fail (printf "Herdr shortcut %s is already used by %s" $binding.key $name) -}}
{{-     end -}}
{{-   end -}}
{{-   $commands = append $commands . -}}
{{- end -}}
{{- $_ := set $keys "command" $commands -}}
{{- $_ := set $config "keys" $keys -}}
{{- if eq $before (toJson $config) -}}
{{ .chezmoi.stdin -}}
{{- else -}}
{{ $config | toToml -}}
{{- end -}}
