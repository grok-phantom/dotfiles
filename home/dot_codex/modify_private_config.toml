{{- /* chezmoi:modify-template */ -}}
{{- /* roost_hooks: roost now hears from Codex through its lifecycle hooks (hooks.json), so notify
       goes back to Codex Computer Use alone. Earlier setups wrapped notify with roost, and Computer
       Use then wrapped that again (`--previous-notify "[…roost…]"`), where roost lost $TMUX_PANE;
       both wrappings are taken out. Parse the array as TOML; leave unrelated notify values
       and the rest of the file byte-for-byte unchanged. */ -}}
{{- $config := .chezmoi.stdin -}}
{{- $prefix := printf "%s, \"hook\", \"codex\"" (printf "%s/bin/roost" .chezmoi.homeDir | toJson) -}}
{{- $notify := get (fromToml $config) "notify" -}}
{{- $inner := "" -}}
{{- if kindIs "slice" $notify -}}
{{-   $args := list -}}
{{-   range $notify -}}
{{-     $args = append $args (toJson .) -}}
{{-   end -}}
{{-   $inner = join ", " $args -}}
{{- end -}}
{{- /* The notify value without roost. */ -}}
{{- $want := $inner -}}
{{- if hasPrefix $prefix $want -}}
{{-   $want = "" -}}
{{-   if contains `"--chain",` $inner -}}
{{-     $want = regexReplaceAll `^.*?"--chain",[ \t]*` $inner "" -}}
{{-   end -}}
{{- end -}}
{{- $want = regexReplaceAll `,[ \t]*"--previous-notify",[ \t]*"(?:[^"\\]|\\.)*roost\\",[ ]*\\"hook\\",[ ]*\\"codex\\"(?:[^"\\]|\\.)*"` $want "" -}}
{{- $result := $config -}}
{{- if ne $want $inner -}}
{{- /* Locate only the legacy assignment being migrated, including multiline arrays and
         comments. Quoted strings may themselves contain brackets or escaped quotes. */ -}}
{{-   $array := `(?m)^[ \t]*(?:notify|"notify"|'notify')[ \t]*=[ \t]*\[(?:[ \t\r\n,]|#[^\r\n]*|"(?:[^"\\]|\\.)*"|'[^']*')*\]` -}}
{{-   $line := regexFind (printf `%s[ \t]*(?:#[^\r\n]*)?(?:\r?\n|$)` $array) $config -}}
{{-   if or (not $line) (ne (get (fromToml $line) "notify" | toJson) ($notify | toJson)) -}}
{{-     fail "~/.codex/config.toml: cannot locate legacy roost notify safely" -}}
{{-   end -}}
{{-   if $want -}}
{{-     $replacement := regexReplaceAllLiteral $array $line (printf "notify = [%s]" $want) -}}
{{-     $result = replace $line $replacement $config -}}
{{-   else -}}
{{-     $result = replace $line "" $config -}}
{{-   end -}}
{{- end -}}
{{ $result -}}
